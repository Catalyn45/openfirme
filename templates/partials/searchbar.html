<div class="search-wrapper">

    <div class="search-box">

        <input
            type="text"
            enterkeyhint="go"
            id="searchInput"
            placeholder="Caută după nume firmă sau CUI..."
			onkeydown="if (event.key === 'Enter') component.searchFirma()"
        >

        <button onclick="component.searchFirma()">
            🔍 Caută
        </button>

    </div>

</div>
