<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/public/css/style.css">
    <link rel="stylesheet" href="/public/css/home.css">

    <title>OpenFirme România — Informații despre companii</title>
</head>

<body>

<!-- ============================================================
     HEADER
============================================================ -->

<header>

    <div class="logo">
        OpenFirme<span> România</span>
    </div>

    <nav>
        <a href="/">Căutare</a>
        <a href="/top/1">Companii</a>
        <a href="#">Despre proiect</a>
    </nav>

</header>


<!-- ============================================================
     HERO / SEARCH
============================================================ -->

<section class="hero">

    <h1>Găsește orice companie din România</h1>

    <p>
        Caută informații publice despre societăți comerciale
        folosind denumirea firmei    </p>

    <div class="search-wrapper">

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Caută după nume firmă..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="searchCompanies()">
                🔍 Caută
            </button>

        </div>

    </div>

</section>

<!-- ============================================================
     MAIN
============================================================ -->

<main>

<div class="home-layout">

            <aside class="filters">

                <h3>Filtre</h3>


                <div class="filter-group">

                    <label for="countyFilter">
                        Județ
                    </label>

                    <select id="countyFilter">

                        <option value="">
                            Toate județele
                        </option>

                        <option value="Alba">Alba</option>
                        <option value="Arad">Arad</option>
                        <option value="Argeş">Argeş</option>
                        <option value="Bacău">Bacău</option>
                        <option value="Bihor">Bihor</option>
                        <option value="Bistriţa-Năsăud">Bistriţa-Năsăud</option>
                        <option value="Botoşani">Botoşani</option>
                        <option value="Brăila">Brăila</option>
                        <option value="Braşov">Braşov</option>
                        <option value="Bucureşti">Bucureşti</option>
                        <option value="Buzău">Buzău</option>
                        <option value="Călăraşi">Călăraşi</option>
                        <option value="Caraş-Severin">Caraş-Severin</option>
                        <option value="Cluj">Cluj</option>
                        <option value="Constanţa">Constanţa</option>
                        <option value="Covasna">Covasna</option>
                        <option value="Dâmboviţa">Dâmboviţa</option>
                        <option value="Dolj">Dolj</option>
                        <option value="Galaţi">Galaţi</option>
                        <option value="Giurgiu">Giurgiu</option>
                        <option value="Gorj">Gorj</option>
                        <option value="Harghita">Harghita</option>
                        <option value="Hunedoara">Hunedoara</option>
                        <option value="Ialomiţa">Ialomiţa</option>
                        <option value="Iaşi">Iaşi</option>
                        <option value="Ilfov">Ilfov</option>
                        <option value="Maramureş">Maramureş</option>
                        <option value="Mehedinţi">Mehedinţi</option>
                        <option value="Mureş">Mureş</option>
                        <option value="Neamţ">Neamţ</option>
                        <option value="Olt">Olt</option>
                        <option value="Prahova">Prahova</option>
                        <option value="Sălaj">Sălaj</option>
                        <option value="Satu Mare">Satu Mare</option>
                        <option value="Sibiu">Sibiu</option>
                        <option value="Suceava">Suceava</option>
                        <option value="Teleorman">Teleorman</option>
                        <option value="Timiş">Timiş</option>
                        <option value="Tulcea">Tulcea</option>
                        <option value="Vâlcea">Vâlcea</option>
                        <option value="Vaslui">Vaslui</option>
                        <option value="Vrancea">Vrancea</option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="statusFilter">
                        Status firmă
                    </label>

                    <select id="statusFilter">

                        <option value="">
                            Orice status
                        </option>

                        <option value="funcțiune" selected>
                            Activă
                        </option>

                        <option value="radiată">
                            Radiată
                        </option>

                        <option value="dizolvare">
                            Dizolvată
                        </option>

                    </select>

                </div>


                <div class="filter-group">

                    <label for="formaFilter">
                        Formă juridică
                    </label>

                    <select id="formaFilter">

                        <option value="">
                            Oricare
                        </option>

                        <option value="SRL">
                            SRL
                        </option>

                        <option value="PFA">
                            PFA
                        </option>

                    </select>

                </div>

                <button
                    class="reset-btn"
                    onclick="resetFilters()"
                >
                    Resetează filtrele
                </button>

            </aside>


    <section class="home-content">

        <!-- Future company results -->

    </section>

</div>

</main>


<!-- ============================================================
     FOOTER
============================================================ -->

<footer>

    © 2026 OpenFirme România

    <br><br>

    Platformă de căutare și agregare a informațiilor
    publice despre companii din România.

</footer>

<script src="/public/js/main.js"></script>

</body>
</html>
