# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25.1'

    - name: Build for Linux
      run: |
        mkdir -p dist

        go build -tags "fts5" -v -o dist/openfirme ./cmd/website
        go build -tags "fts5" -v -o dist/openfirme_parser ./cmd/parser
        go build -tags "fts5" -v -o dist/openfirme_downloader ./cmd/downloader

    - name: Upload Linux binary
      uses: actions/upload-artifact@v4
      with:
        name: openfirme
        path: dist/
